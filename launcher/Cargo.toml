[package]
name = "launcher"
version = "0.1.0"
edition = "2024"
description = "Keeps Panic and Improvise up to date from its GitHub releases, and starts it"

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
